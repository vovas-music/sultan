<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seek test — Мой султан</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1b; --bg: #fafafa; --muted: #6b6b6b; --line: #d8d8d8; --accent: #2a5bd7; --bad: #c0392b; --good: #1e8449; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #161616; --muted: #9a9a9a; --line: #333; --accent: #7aa2ff; --bad: #ff7b6b; --good: #6fd08c; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; font: 16px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 560px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0 0 16px; }
  legend { font-size: 13px; color: var(--muted); padding: 0 4px; }
  label { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; }
  label small { color: var(--muted); }
  .clock { font: 600 40px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; min-height: 1.4em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  button { font: inherit; padding: 12px 8px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:active { opacity: .7; }
  .wide { grid-column: 1 / -1; }
  #log { margin-top: 16px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .bad { color: var(--bad); } .good { color: var(--good); }
</style>
</head>
<body>
<h1>Тест перемотки</h1>
<p>Одна песня в трёх упаковках. MP3 — эталон: iPhone перематывает его точно. Прыгни в точку на MP3, запомни, что звучит, потом нажми «Та же секунда, другой файл» — если кусок не сменился, файл перематывается точно.</p>

<fieldset>
  <legend>Файл</legend>
  <label><input type="radio" name="src" value="../sultan.master.mp3" checked> MP3 <small>эталон, 320 kbps CBR</small></label>
  <label><input type="radio" name="src" value="https://raw.githubusercontent.com/vovas-music/sultan/main/Poluzhivye%20-%20Moy%20Sultan.mp4"> FLAC в MP4 с raw <small>как на сайте: raw.githubusercontent.com, application/octet-stream</small></label>
  <label><input type="radio" name="src" value="../sultan.mp4"> FLAC в MP4 с Pages <small>тот же звук, audio/mp4</small></label>
  <label><input type="radio" name="src" value="../sultan.flac"> FLAC <small>с таблицей перемотки</small></label>
</fieldset>

<div class="clock" id="clock">0:00.0</div>
<div class="sub" id="status">не загружено</div>

<div class="row">
  <button class="primary" id="play">▶︎ Играть</button>
  <button id="pause">❚❚ Пауза</button>
  <button id="to180">→ 3:00</button>
  <button id="toEnd">→ конец − 20 с</button>
  <button id="to60">→ 1:00</button>
  <button id="back5">− 5 с</button>
  <button class="wide" id="swap">Та же секунда, другой файл</button>
</div>

<div id="log"></div>

<script>
  const audio = new Audio();
  audio.preload = 'metadata';
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => !isFinite(s) ? '—' : `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  const log = (line, cls) => {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = `${new Date().toLocaleTimeString()}  ${line}`;
    $('log').prepend(div);
  };
  const chosen = () => document.querySelector('input[name=src]:checked').value;

  function load(src, at, play) {
    audio.src = src;
    log(`load ${src}${at === undefined ? '' : ` → ${fmt(at)}`}`);
    if (at !== undefined) {
      audio.addEventListener('loadedmetadata', () => { audio.currentTime = at; }, { once: true });
    }
    if (play) audio.play().catch((e) => log(`play() rejected: ${e.name}`, 'bad'));
  }
  function ensure(play) {
    if (audio.getAttribute('src') !== chosen()) load(chosen(), undefined, play);
    else if (play) audio.play().catch((e) => log(`play() rejected: ${e.name}`, 'bad'));
  }
  function seek(target) {
    ensure(true);
    const go = () => { audio.currentTime = target(); log(`seek → ${fmt(target())} (${chosen()})`); };
    if (audio.readyState >= 1) go(); else audio.addEventListener('loadedmetadata', go, { once: true });
  }

  $('play').onclick = () => ensure(true);
  $('pause').onclick = () => audio.pause();
  $('to180').onclick = () => seek(() => 180);
  $('to60').onclick = () => seek(() => 60);
  $('toEnd').onclick = () => seek(() => audio.duration - 20);
  $('back5').onclick = () => seek(() => Math.max(0, audio.currentTime - 5));
  $('swap').onclick = () => {
    const radios = [...document.querySelectorAll('input[name=src]')];
    const at = audio.currentTime;
    const next = radios[(radios.findIndex((r) => r.checked) + 1) % radios.length];
    next.checked = true;
    load(next.value, at, true);
  };
  document.querySelectorAll('input[name=src]').forEach((r) => r.onchange = () => {
    const at = audio.getAttribute('src') ? audio.currentTime : undefined;
    load(chosen(), at, !audio.paused);
  });

  const status = () => {
    $('clock').textContent = fmt(audio.currentTime);
    const b = audio.buffered;
    const loaded = b.length ? `загружено ${fmt(b.start(b.length - 1))}–${fmt(b.end(b.length - 1))}` : 'ничего не загружено';
    $('status').textContent = `${audio.getAttribute('src') ?? '—'} · длина ${fmt(audio.duration)} · ${loaded}`;
  };
  audio.addEventListener('timeupdate', status);
  audio.addEventListener('progress', status);
  for (const ev of ['loadedmetadata', 'playing', 'waiting', 'seeked', 'ended']) {
    audio.addEventListener(ev, () => log(`${ev} @ ${fmt(audio.currentTime)}`));
  }
  audio.addEventListener('error', () => log(`error ${audio.error?.code}: ${audio.error?.message || 'не удалось воспроизвести'}`, 'bad'));

  const probe = new Audio();
  for (const type of ['audio/mp4; codecs="flac"', 'audio/flac', 'audio/mpeg']) {
    const answer = probe.canPlayType(type) || 'no';
    log(`canPlayType(${type}) = ${answer}`, answer === 'no' ? 'bad' : 'good');
  }
  log(navigator.userAgent);
</script>
</body>
</html>
